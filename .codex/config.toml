[mcp_servers.conv-edt]
url = "http://localhost:8767/mcp"
enabled = true
required = false
startup_timeout_sec = 2
description = "1C:EDT workspace on port 8767: КД — конфигурация «Конвертация данных 3.1»; KFK — расширение для адаптации конфигурации под Kafka-адаптер."
default_tools_approval_mode = "approve"
disabled_tools = ["git", "ask_workmate"]

[mcp_servers.conv-edt.tools.delete_metadata]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.delete_project]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.delete_infobase]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.update_database]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.import_configuration_from_xml]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.clean_project]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.set_infobase_credentials]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.set_variable]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.evaluate_expression]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.create_git_branch]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.switch_git_branch]
approval_mode = "prompt"
[mcp_servers.conv-edt.tools.set_branch_infobase]
approval_mode = "prompt"
